services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: competence_analyzer_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: competence_analyzer
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/test_data.sql:/docker-entrypoint-initdb.d/02-test_data.sql
    networks:
      - competence_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # C++ Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: competence_analyzer_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: competence_analyzer
    networks:
      - competence_network
    stdin_open: true
    tty: true
    restart: unless-stopped

  # C++ Web UI
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web_cpp
    container_name: competence_analyzer_web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: competence_analyzer
      COMP_ANALYZER_WEB_STATIC: /app/web/static
    ports:
      - "8000:8000"
    networks:
      - competence_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  competence_network:
    driver: bridge

